<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bienvenue sur la page d'accueil de l'OMJL" />
  <meta name="robots" content="index, follow" />
  <title>OMJL - Page d'accueil</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="logo.png" />

  <meta property="og:title" content="OMJL - Page d'accueil" />
  <meta property="og:description" content="Bienvenue sur la page d'accueil de l'OMJL" />
  <meta property="og:image" content="logo.png" />
  <meta property="og:url" content="https://parlement-du-listenbourg.github.io/OMJL/" />
  <meta property="og:type" content="website" />
  <meta property="og:determiner" content="le" />
  <meta property="og:locale" content="fr_FR" />
</head>
<body>
  <header class="main-header">
    <img src="logo.png" alt="Logo du journal" class="logo" />
    <span class="page-title">Page d'accueil</span>

    <div class="header-actions">
      <!-- Emplacement DESKTOP pour les filtres -->
      <div id="filtersHeaderSlot"></div>

      <!-- Bouton + avec menu -->
      <div class="dropdown">
        <button id="dropdownToggle" class="header-button" aria-haspopup="true" aria-expanded="false">+</button>
        <div id="dropdownMenu" class="dropdown-content" role="menu">
          <a href="https://discord.gg/UJDYnnFdcK" role="menuitem">Discord Média du Listenbourg</a>
          <a href="https://discord.gg/rZervsXnWs" role="menuitem">Discord OMJL</a>
          <hr class="dropdown-separator" />

          <!-- Emplacement MOBILE pour les filtres (dans le menu +) -->
          <div id="dropdownFiltersAnchor"></div>

          <hr class="dropdown-separator" />
          <a id="lastArticleLink" href="#" role="menuitem">Dernier article</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Bloc de filtres (UN SEUL) : on le déplace entre header et menu + en JS -->
  <div id="filters" class="filters-inline filters-inline--header" aria-label="Filtres">
    <select id="mediaFilter" aria-label="Filtrer par média">
      <option value="all">Tous les médias</option>
      <option value="imago">Imago Veritatis</option>
      <option value="rtl">RTL World</option>
    </select>

    <select id="categoryFilter" aria-label="Filtrer par catégorie">
      <option value="all">Toutes les catégories</option>
    </select>
  </div>

  <div id="articles-container"></div>

  <!-- Script ultra-léger qui déplace #filters selon la largeur -->
  <script>
    (function () {
      const filtersEl = document.getElementById('filters');
      const headerSlot = document.getElementById('filtersHeaderSlot');
      const dropdownSlot = document.getElementById('dropdownFiltersAnchor');
      const mq = window.matchMedia('(max-width: 768px)');

      function relocate(e) {
        if (!filtersEl || !headerSlot || !dropdownSlot) return;
        if (e.matches) {
          // MOBILE -> dans le menu +
          if (filtersEl.parentNode !== dropdownSlot) {
            dropdownSlot.appendChild(filtersEl);
            filtersEl.classList.remove('filters-inline--header');
            filtersEl.classList.add('filters-inline--dropdown');
          }
        } else {
          // DESKTOP -> dans le header
          if (filtersEl.parentNode !== headerSlot) {
            headerSlot.appendChild(filtersEl);
            filtersEl.classList.remove('filters-inline--dropdown');
            filtersEl.classList.add('filters-inline--header');
          }
        }
      }

      relocate(mq);
      if (mq.addEventListener) mq.addEventListener('change', relocate);
      else mq.addListener(relocate); // vieux navigateurs
    })();
  </script>

  <script type="module" src="articles.js"></script>
</body>
</html>
