<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bienvenue sur la page d'accueil de l'OMJL">
    <meta name="robots" content="index, follow">
    <title>OMJL - Page d'accueil</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="logo.png">

    <meta property="og:title" content="OMJL - Page d'accueil" />
    <meta property="og:description" content="Bienvenue sur la page d'accueil de l'OMJL" />
    <meta property="og:image" content="logo.png" />
    <meta property="og:url" content="https://parlement-du-listenbourg.github.io/OMJL/" />
    <meta property="og:type" content="website" />
    <meta property="og:determiner" content="le" />
    <meta property="og:locale" content="fr_FR" />
</head>
<body>
    <header class="main-header">
        <img src="logo.png" alt="Logo du journal" class="logo">
        <span class="page-title">Page d'accueil</span>
        <div class="dropdown">
            <button id="dropdownToggle" class="header-button">+</button>
            <div id="dropdownMenu" class="dropdown-content">
                <a href="https://discord.gg/dttgPJzTmK">Discord Groupe RTL</a>
                <a href="https://discord.gg/VnjaETmxD2">Discord Parlement du Listenbourg</a>
                <a href="./login/index.html">Connexion administrateur</a>
                <a href="./about">À propos de l'OMJL</a>
                <hr class="dropdown-separator" />
                <a id="lastArticleLink" href="#">Dernier article</a>
                <div class="header-select">
                <select id="categoryFilter">
                    <option value="all">Toutes les catégories</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <div id="articles-container"></div>

    <script type="module" src="articles.js"></script>
</body>
</html>
